<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Passbook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#0F1A30;
  --bg-alt:#16233F;
  --paper:#FBF7EC;
  --paper-line:#E6DCC3;
  --ink:#221F1A;
  --gold:#C9A227;
  --gold-deep:#8C6D1F;
  --stamp:#A63D30;
  --muted:#6E6656;
  --success:#2F6B3E;
  --success-bg:#E6EFE3;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(ellipse at top, var(--bg-alt), var(--bg) 70%);
  font-family:'Inter',sans-serif;
  color:var(--ink);
  min-height:100vh;
  padding:20px 14px 60px;
}
.wrap{max-width:460px;margin:0 auto;}

.masthead{
  text-align:center;
  color:var(--paper);
  margin-bottom:18px;
}
.masthead .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:4px;
}
.masthead h1{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:28px;
  margin:0;
  letter-spacing:0.3px;
}
.masthead p{
  font-size:12.5px;
  color:#B9C2D6;
  margin:4px 0 0;
}

/* Passbook card */
.passbook{
  background:var(--paper);
  border-radius:4px;
  box-shadow:0 18px 40px rgba(0,0,0,0.35), inset 0 0 0 1px var(--paper-line);
  padding:22px 20px 18px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.passbook::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:8px;
  background:repeating-linear-gradient(0deg,var(--gold-deep) 0 3px, transparent 3px 9px);
  opacity:0.5;
}
.passbook-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:1px dashed var(--paper-line);
  padding-bottom:14px;
  margin-bottom:14px;
}
.streak-num{
  font-family:'Fraunces',serif;
  font-size:46px;
  font-weight:700;
  line-height:1;
  color:var(--stamp);
}
.streak-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:4px;
}
.best-badge{
  text-align:right;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
}
.best-badge b{color:var(--ink);font-size:15px;display:block;}

.stamp-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.stamp{
  width:30px;height:30px;
  border-radius:50%;
  border:2px solid var(--paper-line);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  color:var(--paper-line);
  font-family:'JetBrains Mono',monospace;
  flex-shrink:0;
}
.stamp.done{
  border-color:var(--stamp);
  color:var(--stamp);
  transform:rotate(-8deg);
  font-weight:700;
}

.next-line{
  font-size:12.5px;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}
.next-line b{color:var(--ink);}

/* Today card */
.card{
  background:var(--paper);
  border-radius:4px;
  box-shadow:0 10px 24px rgba(0,0,0,0.28), inset 0 0 0 1px var(--paper-line);
  padding:20px;
  margin-bottom:16px;
}
.card-tag{
  display:inline-block;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gold-deep);
  background:#F3E9C9;
  padding:3px 9px;
  border-radius:2px;
  margin-bottom:10px;
}
.card h2{
  font-family:'Calibri','Segoe UI','Inter',sans-serif;
  font-size:19px;
  margin:0 0 12px;
}
.q-block{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:3px;
  padding:12px 14px;
  margin-bottom:10px;
  font-size:14px;
  line-height:1.5;
  font-family:'Calibri','Segoe UI','Inter',sans-serif;
}
.q-block .qn{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--gold-deep);
  margin-bottom:4px;
  display:block;
}
.q-block .q-text{margin-bottom:10px;}
.reveal-btn{
  background:none;
  border:1px solid var(--gold-deep);
  color:var(--gold-deep);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:6px 10px;
  border-radius:3px;
  cursor:pointer;
  width:auto;
}
.a-text{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--paper-line);
  font-size:13.5px;
  line-height:1.55;
  color:#3A3527;
  font-family:'Calibri','Segoe UI','Inter',sans-serif;
}
select, textarea{
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  padding:9px 10px;
  border:1px solid var(--paper-line);
  border-radius:3px;
  background:#fff;
  color:var(--ink);
  margin-bottom:10px;
}
textarea{resize:vertical;min-height:60px;}
button{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13.5px;
  border:none;
  border-radius:3px;
  padding:11px 16px;
  cursor:pointer;
  width:100%;
}
.btn-primary{
  background:var(--ink);
  color:var(--paper);
}
.btn-primary:disabled{
  background:#B9B2A0;
  cursor:default;
}
.btn-secondary{
  background:transparent;
  color:var(--muted);
  border:1px solid var(--paper-line);
  margin-top:8px;
}
.done-banner{
  background:var(--success-bg);
  color:var(--success);
  font-size:13px;
  font-weight:600;
  padding:10px 12px;
  border-radius:3px;
  margin-bottom:10px;
}

/* Log */
.log-title{
  color:var(--paper);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:22px 0 8px 4px;
}
.log-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 4px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:12.5px;
  color:#C7CEDE;
}
.log-row .d{font-family:'JetBrains Mono',monospace;color:var(--gold);flex-shrink:0;}
.log-row .t{flex:1;color:#EDEFF5;}
.log-empty{
  color:#7C859C;
  font-size:12.5px;
  padding:10px 4px;
  font-style:italic;
}
.tabs{
  display:flex;
  gap:6px;
  margin-bottom:16px;
  background:rgba(255,255,255,0.06);
  padding:4px;
  border-radius:6px;
}
.tab-btn{
  flex:1;
  background:none;
  border:none;
  color:#B9C2D6;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13px;
  padding:9px 6px;
  border-radius:4px;
  cursor:pointer;
}
.tab-btn.active{
  background:var(--paper);
  color:var(--ink);
}
.lib-topic{
  margin-bottom:14px;
}
.lib-topic-title{
  color:var(--gold);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:0 0 8px 4px;
}
.lib-q{
  background:var(--paper);
  border-radius:4px;
  box-shadow:inset 0 0 0 1px var(--paper-line);
  padding:14px 16px;
  margin-bottom:8px;
  font-family:'Calibri','Segoe UI','Inter',sans-serif;
}
.reset-link{
  text-align:center;
  margin-top:20px;
}
.reset-link button{
  background:none;
  color:#7C859C;
  font-size:11px;
  text-decoration:underline;
  width:auto;
  padding:4px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="eyebrow">Fintech PM Track</div>
    <h1>Practice Passbook</h1>
    <p>Mon · Wed · Fri · Sat — evening entries</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabToday">Today</button>
    <button class="tab-btn" id="tabLibrary">Practice Questions</button>
  </div>

  <div id="todayView">
  <div class="passbook">
    <div class="passbook-header">
      <div>
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-label">day streak</div>
      </div>
      <div class="best-badge">
        <b id="bestNum">0</b>
        best streak
      </div>
    </div>
    <div class="stamp-row" id="stampRow"></div>
    <div class="next-line" id="nextLine">Loading…</div>
  </div>

  <div class="card" id="todayCard">
    <div class="card-tag" id="topicTag">TODAY</div>
    <h2 id="topicHeading">Loading…</h2>
    <div id="questionArea"></div>
    <textarea id="noteField" placeholder="Optional: jot a note on how it went…"></textarea>
    <button class="btn-primary" id="markBtn">Mark session practiced</button>
    <label style="font-size:12px;color:var(--muted);display:block;margin:10px 0 4px;">Or jump to a different topic</label>
    <select id="topicSelect"></select>
  </div>

  <div class="card" id="moreCard" style="display:none;">
    <div class="card-tag">EXTRA PRACTICE</div>
    <h2>Want another question today?</h2>
    <p style="font-size:13px;color:var(--muted);margin:-6px 0 12px;">Your streak's already counted for today — this just adds more reps.</p>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Topic</label>
    <select id="moreTopicSelect"></select>
    <button class="btn-primary" id="moreBtn">Give me another question</button>
  </div>

  <div class="log-title">Ledger</div>
  <div id="logList"></div>

  <div class="reset-link"><button id="resetBtn">Reset all data</button></div>
  </div>

  <div id="libraryView" style="display:none;"></div>
</div>

<script>
const TOPICS = {
  product_sense: {
    label: "Product Sense",
    questions: [
      { q: "Design a bill payment reminder feature for BBPS users who frequently miss due dates.",
        a: "Scope to existing users, prioritize electricity (highest volume, less reminder-overlap than credit cards). Segment root causes: reminder ignored (SMS fatigue) vs never-received (network/opt-out). Solve for 'ignored' first — highest reach, lowest effort. Ship in-app nudge + WhatsApp/email in phase 1 (4 wks) to validate; scale via third-party app integrations (PhonePe/GPay) in phase 2. Metric: % reduction in missed-due-date payments; secondary: reminder open/click rate." },
      { q: "How would you improve the first-time NACH mandate creation flow?",
        a: "Identify friction: bank selection confusion, OTP drop-offs, unclear physical-mandate fallback. Pre-fill customer/account data via Account Aggregator consent to cut manual entry. Single consolidated consent screen instead of multi-step forms. Real-time status tracker (pending/approved/failed with reason) instead of silent waiting. Metric: mandate completion rate, time-to-activate." },
      { q: "Redesign UPI AutoPay's mandate-pause experience.",
        a: "Problem: users cancel fully instead of pausing because pause isn't visible/granular. Add 'pause for N cycles' as a first-class action next to cancel, with auto-resume reminder before reactivation. Show pause impact clearly (e.g., 'next debit skipped, resumes on [date]'). Metric: reduction in full cancellations, pause-to-resume conversion rate." },
      { q: "How would you help users recover from a failed eNACH mandate registration?",
        a: "Show the actual failure reason (bank server down, invalid account, OTP expiry) instead of a generic error. Offer immediate retry for transient failures, and a fallback path (physical NACH or alternate bank) for hard failures. Track retry success rate as the core metric; segment failures by bank to catch systemic issues." },
      { q: "Design a feature to reduce Digital Cancelled Cheque upload failures.",
        a: "Root causes usually: poor lighting/glare, cropped edges, low OCR confidence on handwritten fields. Add a live camera guide overlay with real-time quality feedback, allow manual correction of OCR-extracted fields before submit, and a manual-entry fallback if OCR confidence is low. Metric: first-attempt upload success rate." },
      { q: "How would you design an onboarding flow for a first-time BBPS biller?",
        a: "Break onboarding into a checklist (KYC docs, bank integration, test transactions) with visible status per step. Assign a single point of contact/dedicated support for the first 30 days. Provide a sandbox for test billing before go-live. Metric: time-to-go-live, drop-off rate by step." },
      { q: "Design a credit line feature for gig-economy workers with irregular income.",
        a: "Traditional income-proof underwriting excludes this segment — use behavior-based signals instead (bank transaction history, gig-platform earnings via Account Aggregator consent). Start with small, conservative credit limits and increase based on observed repayment behavior rather than upfront income assumptions. Phase 1: pilot with one gig-platform partner to validate the data signal quality. Metric: approval rate, default rate by limit tier, limit utilization." },
      { q: "How would you design a first investment experience for someone who has never invested before?",
        a: "The barrier is anxiety and choice-overload, not access — start with one clear, low-risk recommended option (e.g. a liquid fund) tied to a specific goal, explained in plain language, rather than a menu of products. Keep the minimum investment low to reduce psychological commitment. Show progress visually to reinforce the habit. Metric: activation rate (first investment within 7 days), 90-day retention." },
      { q: "Design a claims-filing experience for a health insurance app that reduces claim rejection rates.",
        a: "Most rejections trace back to incomplete/incorrect documentation at submission — build a guided, checklist-driven flow with real-time validation against policy terms, pre-filled known data, and a pre-submission eligibility check that flags likely rejection reasons before the user submits. Metric: first-submission approval rate, average claim resolution time." },
      { q: "How would you design a savings feature to help users build an emergency fund?",
        a: "Behavioral design matters more than raw functionality: automate small contributions (round-ups or a % of income) with an easy pause option — friction on withdrawal erodes trust in a banking product, so don't lock funds. Use visual goal-tracking and nudges tied to actual spending patterns. Metric: % of users reaching a 3-month buffer target, opt-out rate." },
      { q: "You're the PM for a bank-account-linking product (in the vein of Plaid's Account Verification flow). How would you reduce user drop-off during the bank authentication step?",
        a: "Instrument the funnel step-by-step first — drop-off concentrated at bank selection, credential entry, or post-auth callback each points to a different fix. If it's bank selection, add a search/recent-banks shortcut; if it's credential entry, check for banks with unreliable login pages and offer a statement-upload fallback; if it's post-auth, check callback latency/timeouts. Prioritize fixing the 3-5 banks that account for the most volume rather than a generic fix. Metric: authentication completion rate by bank, end-to-end linking success rate.",
        source: "reported", addedDate: "2026-08-29" },
      { q: "Design a dispute/chargeback filing experience for a debit card app that reduces resolution time.",
        a: "Most delay comes from missing evidence at first submission — build a guided flow that asks dispute-type-specific questions upfront (unauthorized vs. not-as-described vs. duplicate charge) and auto-attaches transaction metadata the user shouldn't have to hunt for. Set clear, visible SLA expectations per dispute type instead of a generic 'we'll get back to you,' and push proactive status updates rather than making users check back. Metric: time-to-resolution, first-submission completeness rate (% disputes not sent back for more info).",
        source: "claude", addedDate: "2026-09-02" },
      { q: "How would you redesign the KYC re-verification flow for dormant bank accounts to reduce user drop-off?",
        a: "Dormant-account users have low motivation to re-engage, so minimize friction at every step: pre-fill whatever data is already on file, allow re-verification via a single video-KYC session instead of branch visits, and clearly state why it's needed (regulatory, not punitive) to reduce distrust. Offer a scheduling option for users who can't complete it in one sitting rather than losing them entirely. Metric: re-verification completion rate, average time from prompt to completion.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Design a feature to help paycheck-to-paycheck users avoid overdraft fees.",
        a: "The core insight: these users need a safety net that doesn't feel like a loan with interest — a fee-free short-term advance tied to detected income (payroll deposit pattern) works better than a traditional overdraft line. Make eligibility and available amount transparent upfront so it doesn't feel like a black box, and auto-repay on next paycheck deposit with an easy opt-out if repayment would cause hardship. Metric: overdraft-fee incidents avoided per active user, advance repayment default rate.",
        source: "reported", addedDate: "2026-09-02" },
      { q: "Design a 'split bill' feature for a UPI-based group expense app.",
        a: "Core friction in group-pay is chasing people, not the payment itself — default to auto-splitting evenly with easy manual adjustment, and send each participant a single UPI collect request rather than requiring the organizer to follow up individually. Show real-time settlement status to the whole group (who's paid, who hasn't) to create light social pressure without the organizer having to nag. Metric: % of split requests fully settled within 48 hours, time from bill creation to full settlement.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "How would you design the credit limit increase request flow for a secured credit card product?",
        a: "Secured cards serve credit-building users, so frame this as a graduation moment, not just a request form — proactively surface eligibility based on observed on-time payment history rather than making users guess when to ask. Show clearly what changes (does the security deposit requirement change too?) since ambiguity here erodes trust in a segment that's often credit-anxious. Metric: eligible-user opt-in rate, subsequent on-time payment rate post-increase (to confirm the increase wasn't over-extending risk).",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Compare the PayPal app to the Venmo experience — what would you improve, from both a product and marketing perspective?",
        a: "Frame the comparison around what each product actually optimizes for — PayPal skews utility/trust for transactional payments and merchant checkout, Venmo skews social (feed, emojis, splitting with friends), so 'improving' one by copying the other's surface features misses why users choose each. The sharper opportunity is usually in the handoff between them: PayPal's own users increasingly want the social/peer-payment ease Venmo has, so the improvement is more about surfacing peer-payment simplicity within PayPal's existing trust/reach, not a redesign. Metric: peer-payment feature adoption among existing PayPal users, cross-sell rate between merchant-checkout users and peer-payment usage.",
        source: "reported", addedDate: "2026-09-05" },
      { q: "How would you apply an emerging technology — generative AI, biometrics, or similar — to a financial product to solve a real user problem, not just add it as a novelty feature?",
        a: "Start from the user problem, not the technology — pick a specific, painful moment (e.g. disputing a transaction, understanding a decline reason, catching a suspicious charge before it's too late) and ask whether the emerging tech genuinely removes friction there or just repackages existing functionality with a chatbot UI. Prototype the narrowest version that tests the core value hypothesis (e.g. can a model actually explain a decline reason more clearly than existing static messaging) before investing in a full experience. Guard against 'innovation theater' — track whether usage of the new feature actually reduces the friction it was meant to solve (e.g. fewer repeat support contacts on the same issue), not just novelty-driven initial engagement.",
        source: "reported", addedDate: "2026-09-07" },
      { q: "Design a feature that helps users understand why their credit score changed this month.",
        a: "Most credit-score confusion comes from users seeing a number move without any attributable cause — surface the top 1-2 specific factors that changed (a new hard inquiry, a utilization increase, an account aging) rather than a generic breakdown of all five scoring factors every time. Tie each factor to a concrete, actionable next step (pay down utilization by $X to recover ~Y points) instead of just naming the factor, since users act on guidance, not diagnosis. Metric: % of score-drop notifications that lead to a corrective action within 30 days, unsubscribe/mute rate on the notification (a proxy for anxiety-inducing rather than helpful framing).",
        source: "claude", addedDate: "2026-09-08" },
      { q: "Design a feature that helps a small business owner understand their cash flow runway — how many days until they run out of money at current burn — inside a business banking app.",
        a: "The hard part isn't the math, it's making an inherently anxiety-inducing number feel actionable rather than alarming — show the runway number alongside the top 1-2 levers that would extend it (a specific recurring expense, an overdue invoice to chase) rather than just a bare countdown. Use historical transaction patterns to project forward, but flag explicitly when the projection is based on thin data (a new business with only a few months of history) so owners don't over-trust a shaky estimate. Metric: % of users who take a suggested action (chase an invoice, adjust a subscription) within a week of a low-runway alert, not just alert open rate.",
        source: "claude", addedDate: "2026-09-10" },
      { q: "Design a feature for a digital bank that helps users recognize and avoid subscription traps — free trials that silently convert to paid, forgotten recurring charges.",
        a: "The core insight is timing: warn before the trial converts, not after the charge already happened, since post-charge notifications just turn into refund-request tickets instead of prevented friction. Surface a simple, scannable list of all recurring charges with next-charge-date and a one-tap cancel-reminder toggle, rather than burying this in a generic transaction history the user has to manually pattern-match. Metric: % of flagged upcoming trial-conversions that get an explicit user action (cancel reminder set, or dismissed as intentional) before the charge date, not just notification open rate.",
        source: "claude", addedDate: "2026-09-11" }
    ]
  },
  execution: {
    label: "Execution / Prioritization",
    questions: [
      { q: "You have 3 engineers and 6 weeks. Prioritize: NACH failure-reason clarity, BBPS new biller onboarding, DCC OCR accuracy improvement. Justify your call.",
        a: "Use RICE: NACH failure-reason clarity affects the largest existing user base with low build effort (mostly UX/messaging) — highest score, pick first. BBPS onboarding is high-impact but effort-heavy (partner-dependent) — phase 2. DCC OCR improvement is valuable but affects a smaller, newer user base — phase 3 or parallel-track if capacity allows." },
      { q: "A key regulatory deadline (RBI mandate) conflicts with a revenue-driving feature launch. How do you sequence?",
        a: "Regulatory deadlines are non-negotiable — compliance risk (penalties, license risk) outweighs revenue delay. Sequence compliance first, but look for a parallel track: can a smaller eng pod handle compliance while the rest continues revenue-feature groundwork (design, backend prep) so launch isn't fully blocked once compliance ships?" },
      { q: "Your BBPS COU integration is delayed by a partner dependency. Walk through how you'd manage the roadmap and stakeholders.",
        a: "Communicate the delay and revised timeline transparently to stakeholders immediately — don't let it surface late. Decouple roadmap items that don't depend on the partner and keep those moving. Escalate through partner's account/BD channel with a clear ask and deadline. Build a fallback (manual/interim process) if the delay risks a committed external date." },
      { q: "How would you decide whether to build vs. buy for a new fraud-check module in DCC?",
        a: "Buy if speed-to-market matters and mature vendor solutions exist with acceptable accuracy/cost — avoids reinventing a solved problem. Build if the fraud patterns are proprietary/unique to your data, or if long-term cost and control (no vendor lock-in) matter more than initial speed. Weigh: cost over 2-3 years, data sensitivity, integration effort, vendor reliability." },
      { q: "Write a 1-week sprint plan for fixing a spike in eNACH mandate failures.",
        a: "Day 1: Pull failure data, segment by bank/error-code/time. Day 2: Identify top 2 root causes (e.g., one bank's API issue). Day 3-4: Ship fix for highest-impact cause + improve error messaging. Day 5: Deploy, monitor dashboards closely. Weekend: on-call watch, rollback plan ready." },
      { q: "You have 4 engineers and 8 weeks. Prioritize: reducing cross-border remittance failure rate, adding a new payout corridor (country), or improving FX rate transparency in the app. Justify.",
        a: "Failure-rate reduction affects every existing user and directly threatens trust/repeat usage — highest priority. A new corridor is high-effort (compliance, banking partner) and only benefits future/new-market users — lower near-term ROI unless a launch date is already committed externally. FX transparency matters but doesn't block transactions, so it's lower urgency. Sequence: fix failures first, FX transparency in parallel if bandwidth allows, corridor expansion next quarter." },
      { q: "Fraud losses spiked 3x this month on your peer-to-peer payment product. Engineering says a full fix will take 6 weeks. What do you do in the meantime?",
        a: "Don't wait passively for the permanent fix — ship interim risk controls: velocity limits on new accounts, step-up authentication on high-risk transaction patterns, a manual review queue for flagged transactions. Communicate transparently with support teams and affected users. Track the false-positive rate on interim controls closely so you're not over-blocking legitimate users while the real fix is in progress." },
      { q: "Your BNPL default rate is rising while approval rates need to stay competitive for growth. How do you sequence the fix?",
        a: "Segment defaults by cohort (signup channel, credit tier, merchant category) to find where risk concentrates, rather than tightening approvals broadly (which kills growth). Tighten only the specific high-risk segment first, monitor the impact on both default rate and approval volume, then decide if broader tightening is warranted. In parallel, test underwriting model improvements (more data signals) so you're not stuck permanently trading growth for risk control." },
      { q: "Card activation rate (card issued but never used) is low, and you have limited engineering capacity. How do you prioritize fixes?",
        a: "Root-cause before committing engineering time: is it a physical delivery delay, an unclear activation flow, or lack of first-use incentive? Pull funnel data first. If activation-flow friction is the bottleneck, that's a quick, high-leverage engineering fix. If it's delivery logistics, that's an ops fix — don't spend engineering capacity solving the wrong lever." },
      { q: "Your team just shipped a UPI AutoPay renewal-reminder feature, but two weeks in, support tickets about 'unexpected debit' have actually gone up, not down. Engineering says proper event-level tracking to diagnose it is 3 weeks out. What do you do in the meantime?",
        a: "Don't wait on full instrumentation — pull whatever proxy signals already exist (support ticket volume by mandate age, refund/dispute logs, app-store review text) to form a working hypothesis fast, e.g. reminder timing or copy causing confusion rather than preventing it. Ship a cheap mitigating change (clearer reminder copy, a 'why am I seeing this' link) within days while proper instrumentation lands in parallel. Set a hard checkpoint to revisit with real data once tracking ships, rather than treating the quick fix as the final answer.",
        source: "claude", addedDate: "2026-08-29" },
      { q: "Your VP asks you to brainstorm 10 ways to increase engagement on your savings product in the next 30 minutes, then pick the one to build. Walk through how you'd run that exercise and what you'd pick.",
        a: "Time-box the brainstorm and force quantity over quality first (10 ideas in 10 minutes, no filtering) — early filtering kills the ideas that need a second pass to sound good. Then score against 2-3 shared criteria (expected engagement lift, build effort, dependency risk) rather than picking on gut feel, and pick the one with the best effort-to-signal ratio for a fast test, not necessarily the biggest idea. Commit to a clear success metric and timebox before building, so the exercise produces a decision, not just a list.",
        source: "reported", addedDate: "2026-09-02" },
      { q: "Walk through how you'd use a prioritization framework like MoSCoW or Kano to sequence a backlog of 15 feature requests from your BBPS biller partners.",
        a: "MoSCoW works well here because biller requests span very different urgency levels — sort into Must (blocks a biller from going live, e.g. a required API field), Should (meaningfully improves biller experience but not blocking), Could (nice-to-have), Won't (out of scope this cycle), and be transparent with partners about the 'Won't' bucket rather than going silent. Kano adds a second lens for the 'Should/Could' items — separate basic expectations from delighters, since biller partners will tolerate missing delighters but not missing basics. Sequence Musts first regardless of effort, then rank Should/Could by effort-to-partner-satisfaction ratio.",
        source: "reported", addedDate: "2026-09-02" },
      { q: "Two teams — Compliance and Growth — both claim the next sprint should be theirs: Compliance needs a mandatory disclosure screen added before a regulatory deadline, Growth wants to ship a referral program tied to a marketing campaign already announced externally. You have one pod. How do you resolve it?",
        a: "This isn't actually a toss-up — a regulatory deadline carries real compliance/license risk if missed, while a marketing-announced referral launch carries a reputational/embarrassment cost if delayed, which is recoverable. Ship the compliance screen first, but immediately renegotiate the referral launch date publicly with Growth's stakeholders rather than letting it slip silently, and look for a scoped-down version of the referral program (e.g. soft-launch to a small cohort) that Growth's marketing commitment could still honor on the original date.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Your eNACH product has a known bug that silently duplicates 0.3% of debits — rare, but real money moving twice. Fixing it properly requires refactoring the retry logic, a 3-week project. What do you do this week?",
        a: "Money moving twice, even at 0.3%, is a trust and potentially a regulatory issue — don't wait for the clean 3-week fix. Ship an interim reconciliation job this week that detects duplicate debits within hours and auto-reverses them, even if it's a band-aid on top of the buggy retry logic. Communicate proactively to affected customers and to compliance/finance about the interim control, and only close the loop once the proper retry-logic refactor ships and duplicate incidents drop to zero.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "You're mid-sprint when your CEO asks for a demo-ready prototype of a new UPI-based micro-savings feature for an investor meeting in 5 days. Your team is already committed to a compliance-driven mandate change due the same week. How do you handle it?",
        a: "Don't silently deprioritize the compliance mandate to protect the demo — that's the kind of trade-off that needs to be made visibly, not by default. Scope the investor demo down to a clickable prototype or a narrow real-data slice that doesn't require full production engineering effort, freeing the team to stay on the compliance work. If leadership insists on both at full scope, escalate the trade-off explicitly with the compliance deadline risk spelled out, rather than absorbing the conflict into the team silently.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Walk me through how you'd prioritize a roadmap when engineering capacity is constrained and three internal stakeholders each have competing urgent requests.",
        a: "Don't just rank by who shouts loudest — score each request against the same explicit criteria (customer/revenue impact, regulatory urgency, effort) so stakeholders see the logic, not a political outcome. Separate genuinely urgent (has a hard external deadline or is actively losing money/customers) from merely important, since only the former should jump the queue. Communicate the ranked sequence and the reasoning back to all three stakeholders together, not one-on-one, so no one suspects a different story was told elsewhere — and revisit the ranking on a fixed cadence rather than re-litigating it every time someone escalates.",
        source: "reported", addedDate: "2026-09-04" },
      { q: "Your team has capacity for exactly one major initiative next quarter. Engineering pitches a platform rewrite that will cut future feature-delivery time in half; Sales pitches three specific feature requests tied to deals worth $2M ARR closing this quarter if delivered. How do you decide?",
        a: "Don't treat this as speed vs. revenue — quantify both properly first: what specifically breaks or slows without the rewrite over the next 2-3 quarters (is delivery already visibly degrading, or is this precautionary), and how firm is the $2M ARR (signed contingent on the feature vs. a soft sales promise). If the rewrite is precautionary and the deals are real and contractually tied to specific dates, take the revenue — technical debt rarely kills a company in one quarter, but losing signed deals does. If delivery is already visibly degrading team-wide, the rewrite protects far more than one quarter's revenue and should win; either way, make the trade-off criteria explicit before deciding, not after, so it doesn't look like whoever escalated loudest won.",
        source: "claude", addedDate: "2026-09-05" },
      { q: "Legal tells you a feature you're two days from shipping has a compliance gap that wasn't caught earlier — not severe enough to be illegal, but risky enough that they're uncomfortable. Engineering says fixing it properly adds a week. What do you do?",
        a: "Don't treat 'not severe enough to be illegal' as clearance to ship — a compliance team flagging discomfort this close to launch is a signal worth taking seriously, since they typically only escalate when something crossed a real threshold for them. Get specific with Legal on exactly what risk they're flagging and what the minimum viable mitigation is (it may be smaller than a full week-long fix — e.g. a disclosure or a narrower initial rollout). If a minimum mitigation exists, ship with it and schedule the full fix immediately after; if Legal says there's no partial mitigation, slip the launch rather than override a compliance team's explicit discomfort.",
        source: "claude", addedDate: "2026-09-06" },
      { q: "Design a system that detects and retries failed API calls to upstream banks without duplicating transactions. Walk through your approach.",
        a: "The core requirement is idempotency — every retry needs a unique idempotency key tied to the original request so the upstream bank (or your own system) can recognize and discard a duplicate rather than double-processing it. Use exponential backoff with a capped retry count rather than immediate or unlimited retries, since hammering a struggling upstream bank API makes things worse, and distinguish retryable failures (timeout, 5xx) from non-retryable ones (4xx validation errors) so you're not blindly retrying a request that will never succeed. Track retry success rate and time-to-eventual-success per bank as the key execution metrics, since a bank with a consistently high retry rate is a signal to escalate the integration issue directly rather than keep absorbing it silently.",
        source: "reported", addedDate: "2026-09-08" },
      { q: "Your fraud-ops team wants to add a manual review step for all transactions above $500 to cut fraud losses. Product data shows this would add 12-24 hours of delay for legitimate high-value transactions. How do you resolve this?",
        a: "Don't accept the trade-off as binary — ask fraud-ops for the actual precision of the $500 threshold rule (what % of transactions above it are genuinely fraudulent) before agreeing to blanket manual review, since a blunt threshold likely flags far more legitimate transactions than fraud ones. Propose a risk-scored approach instead: only transactions above $500 AND carrying other risk signals go to manual review, while clean high-value transactions from established customers pass through instantly. Pilot on a small volume slice first, measuring both fraud-loss reduction and legitimate-transaction delay together, rather than optimizing one metric while blind to the other.",
        source: "claude", addedDate: "2026-09-09" },
      { q: "You're two sprints into a quarter-long project when a competitor ships a feature that makes half of your remaining roadmap redundant. Engineering has already built significant infrastructure toward the original plan. How do you respond?",
        a: "Don't let sunk infrastructure cost dictate the decision — evaluate whether the built infrastructure is genuinely reusable toward a revised plan or whether continuing is just protecting past investment. Get a fast, honest assessment from engineering on what specifically the competitor's move actually obsoletes versus what's still differentiated, since 'they shipped something similar' often overstates the actual overlap once you look closely. Re-scope the remaining roadmap around what's still valuable and communicate the change transparently to stakeholders now rather than quietly finishing a plan you already know is partly moot, even if that means eating a hard conversation about the sprints already spent.",
        source: "claude", addedDate: "2026-09-11" }
    ]
  },
  analytics: {
    label: "Analytics / Metrics",
    questions: [
      { q: "Define success metrics for the BBPS bill reminder feature we designed earlier.",
        a: "Primary: % reduction in missed-due-date payments within 90 days. Secondary: reminder open/click-through rate by channel, opt-in rate for WhatsApp, on-time payment rate lift vs control group. Guardrail: opt-out/unsubscribe rate (avoid notification fatigue backlash)." },
      { q: "eNACH mandate success rate dropped 8% last week. Walk through your root-cause approach.",
        a: "Segment the drop: by bank (is it one bank's API/downtime?), by step in funnel (OTP, authorization, activation), by device/OS, and by time (correlate with any recent release or bank-side change). Isolate the single largest contributing segment before proposing a fix — avoid fixing symptoms broadly without a confirmed root cause." },
      { q: "Estimate the number of BBPS bill payments processed daily in India.",
        a: "Structure over precision: ~140Cr population → ~50Cr adults with bank accounts → assume ~60% pay at least one recurring bill (electricity/DTH/etc.) → ~30Cr bill-paying adults → assume ~20% use BBPS specifically (vs. direct biller apps) → ~6Cr BBPS bill-payers → average 1 bill/month → ~20L bills/day roughly. State assumptions clearly and sanity-check against any known public NPCI BBPS volume data if available." },
      { q: "What metrics would you track for Digital Cancelled Cheque adoption in its first quarter?",
        a: "Activation rate (% eligible users who try DCC), first-attempt upload success rate, time-to-approval, repeat usage rate (adoption stickiness), and drop-off rate by step (capture → OCR → review → submit)." },
      { q: "How would you set up an A/B test for a new NACH mandate UI?",
        a: "Define hypothesis (e.g., 'single-screen consent increases completion rate by X%'). Random-assign traffic 50/50, primary metric = mandate completion rate, guardrail metrics = error rate and support tickets. Calculate sample size/duration via a power calculation before launch; avoid peeking early and stopping on noise." },
      { q: "How would you measure the success of an embedded lending product offered inside a partner's e-commerce checkout?",
        a: "Primary: checkout conversion lift for users offered financing vs. not — incrementality, not just raw adoption. Secondary: approval rate, default rate by partner/merchant category, repeat usage rate. Guardrail: partner NPS/complaint rate, since a bad lending experience reflects on the partner's brand, not just yours." },
      { q: "Loan approval rate differs significantly by region. How do you investigate whether this is a fairness/bias issue or a legitimate risk difference?",
        a: "Separate correlation from causation first: check if the regional gap persists after controlling for income, credit history, and other legitimate underwriting factors. If it remains unexplained after controlling for legitimate risk factors, escalate immediately for fairness/compliance review — once bias is suspected, this stops being a growth-metrics question and becomes a compliance one." },
      { q: "How would you define north-star metrics for a robo-advisory investment product?",
        a: "Primary: assets under management (AUM) growth and net-new-money (deposits minus withdrawals) — reflects real trust, not just signups. Secondary: portfolio adherence to the recommended allocation, goal-completion rate. Guardrail: withdrawal rate during market downturns, since panic-selling signals a product/communication gap, not just market conditions." },
      { q: "How would you track whether your fintech product is staying within RBI's data localization and consent requirements as you scale?",
        a: "This isn't a single metric — build a compliance dashboard: % of data flows audited against localization rules, consent-capture completion rate, time-to-remediate flagged violations. Treat these as guardrails reviewed on a fixed cadence with legal/compliance, not ad hoc, since regulatory risk compounds silently until an audit or complaint surfaces it." },
      { q: "You're building a tax-loss harvesting feature for a robo-advisory product that needs to run across millions of accounts nightly. How would you validate that it's working correctly at scale, not just in a demo account?",
        a: "Validate in layers: unit-level correctness (does the harvesting logic obey wash-sale rules and cost-basis math for a single account, checked against a known-correct reference implementation), then a canary rollout to a small % of real accounts with human-reviewed spot-checks before full rollout. At scale, the real risk is silent drift — a batch job that partially fails or times out on a subset of accounts — so instrument completion rate per nightly run and alert on any account skipped, not just aggregate tax-savings numbers. Track realized tax savings per account as the north-star metric, but treat it as a lagging indicator; the leading indicators are job completion rate and rule-compliance rate.",
        source: "reported", addedDate: "2026-09-03" },
      { q: "Approval rates for your BNPL product dropped 6 points over the past two weeks. Walk through how you'd diagnose it.",
        a: "Segment first along product/channel dimensions: by merchant category (some merchant risk profiles shifted?), by cohort (are new applicants riskier, or is scoring stricter for existing users?), and by underwriting rule (is one specific rule now rejecting more?). Cross-check against any recent model retrain, bureau data change, or policy tightening on your end. Isolate whether the drop is deliberate (a recent risk-tightening decision) before treating it as a bug — if intentional, the real question becomes whether it's overcorrecting.",
        source: "reported", addedDate: "2026-09-02" },
      { q: "Size the BNPL market opportunity for a mid-sized e-commerce platform considering adding a 'pay in 4' option at checkout.",
        a: "Structure the estimate from checkout volume, not population: take the platform's annual GMV, estimate the % of purchases in a price band where installments meaningfully help conversion (e.g. $50-$500), assume a BNPL attach rate based on comparable merchants (~15-25% typically), and apply that to estimate incremental GMV lift plus BNPL fee revenue. State assumptions explicitly and sanity-check attach-rate assumptions against any public benchmarks from Affirm/Klarna/Afterpay merchant case studies.",
        source: "reported", addedDate: "2026-09-02" },
      { q: "Your product's headline metric is 'monthly active payers,' but a competitor just launched with the same feature set and a lower headline price. What secondary/guardrail metrics would tell you whether you're actually losing ground, before market share numbers catch up?",
        a: "Pure activity metrics like MAP lag competitive pressure — watch acquisition cost trend (rising CAC is often the earliest signal of share loss before volume drops), win/loss rate in any comparative signup flow, and churn/downgrade rate among price-sensitive segments specifically. A stable MAP number can mask a shrinking new-user funnel offset by retained legacy users, so segment new vs. existing before trusting the headline number.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "How would you measure whether a new in-app financial literacy content series is actually changing user behavior, not just being viewed?",
        a: "Viewership/completion rate only proves attention, not behavior change — pair it with a behavioral metric tied to the content's actual claim (e.g. if a module is about emergency funds, track savings-goal creation rate among viewers vs. a matched non-viewer cohort). Use a holdout/control comparison rather than just before/after, since users who seek out financial content are probably already more engaged savers — a naive comparison overstates impact. Guardrail: content should not correlate with reduced product usage (i.e. education isn't quietly functioning as a distraction from action).",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Your team wants to launch a referral program for a savings account product. What metrics would define success, and what's the biggest way this could look great on paper but be bad in reality?",
        a: "Define success as net-new funded accounts from referred users (not just signups — many referral programs juice vanity signups that never fund), plus referred-user 90-day retention vs. organic. The way this looks great on paper but is bad in reality: a generous referral bonus can attract reward-farmers who open an account, claim the bonus, and churn — so track cost-per-funded-account and early churn rate among referred users specifically, and cap or claw back bonuses tied to a minimum activity/retention threshold.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "As the PM for a crypto exchange's onboarding experience, how would you set goals and define success for the product?",
        a: "Anchor on funded-account conversion, not just signups — crypto onboarding has a long trust-building step (KYC, funding source linkage) where most drop-off actually happens, so measure completion rate at each step (signup → KYC verified → funds deposited → first trade) rather than one blended number. Set the north-star as time-to-first-trade for verified users, since a long gap there signals friction even after KYC clears. Guardrail: verification pass rate shouldn't degrade if you're optimizing for speed, since loosening checks to boost conversion creates downstream compliance risk.",
        source: "reported", addedDate: "2026-09-04" },
      { q: "Your risk model's AUC (a common model-quality metric) improved after a retrain, but the business is seeing more customer complaints about declined transactions. How do you reconcile these two signals?",
        a: "AUC measures rank-ordering quality across the whole population — it can improve in aggregate while getting meaningfully worse for a specific, vocal segment (e.g. a particular merchant category or transaction size band), which is exactly where complaints would concentrate. Segment complaint volume against model decisions on the same population the AUC was measured on, rather than trusting the aggregate metric alone. This is also a reminder that AUC doesn't capture the cost asymmetry between a false decline (angry legitimate customer, lost revenue) and a false approve (fraud loss) — track precision/recall at your actual operating threshold, not just AUC, since that's what customers and revenue actually experience.",
        source: "claude", addedDate: "2026-09-05" },
      { q: "How do you measure the success of a product launch? Which metrics matter most?",
        a: "Separate leading from lagging indicators: in the first days/weeks, watch adoption and activation (are the right users trying it, and completing the core action) since revenue/retention metrics won't have matured yet. Pick 1-2 metrics that matter most based on the launch's actual goal — a growth launch cares about activation and viral/referral coefficient, a retention launch cares about repeat usage and churn delta versus a control cohort. Always pair the headline metric with a guardrail (e.g. don't let a growth push tank fraud rates or support load), since optimizing one metric in isolation is how launches quietly cause damage elsewhere.",
        source: "reported", addedDate: "2026-09-07" },
      { q: "When building a business case around a new metric-driven initiative, what's the difference between a north-star metric, a gut-check metric, and a counter-metric — and how would you pick one of each for a new BNPL feature?",
        a: "North-star: the single metric that best represents real value delivered, e.g. repeat BNPL usage rate (proves ongoing trust, not just a one-time trial). Gut-check: a simpler, harder-to-game sanity metric you'd expect to move in the same direction if the north-star is genuinely improving for the right reasons, e.g. merchant checkout conversion lift — if BNPL usage rises but checkout conversion doesn't, something's off (cannibalization, not incrementality). Counter-metric: the guardrail that catches a north-star win achieved the wrong way, e.g. default/delinquency rate — rising BNPL usage funded by looser underwriting would show up here first.",
        source: "reported", addedDate: "2026-09-09" },
      { q: "Your BNPL default rate looks stable in the aggregate dashboard, but a data analyst flags that default rate has actually been rising steadily for the 'first-time borrower' cohort specifically, masked by a growing base of repeat borrowers with much lower default rates. What do you do?",
        a: "Treat this as a leading indicator, not a footnote — the blended average is being propped up by a shrinking-risk repeat-borrower base while the acquisition funnel's underlying risk quality may be deteriorating, which will eventually show up in the aggregate once repeat-borrower growth slows. Segment underwriting performance by cohort vintage going forward as a standing practice, not a one-off investigation, since blended metrics systematically hide this exact failure mode in any product with a growing base and rising volume. Escalate to risk/underwriting immediately to check whether a recent acquisition channel or approval-criteria change is driving the first-time cohort's rising risk, rather than waiting for the blended number to eventually catch up.",
        source: "claude", addedDate: "2026-09-11" }
    ]
  },
  behavioral: {
    label: "Behavioral",
    questions: [
      { q: "Tell me about a time you had to push back on a stakeholder's requirement. Use your eNACH/BBPS/DCC experience.",
        a: "STAR template — Situation: what was requested and by whom. Task: why it conflicted with your view (compliance risk, user harm, tech debt). Action: how you pushed back — data used, alternative proposed, how you brought them along. Result: outcome + what you'd repeat/change. Use a real moment from your eNACH/BBPS/DCC work — this needs your specifics, not a generic script." },
      { q: "Describe a time a product decision you made didn't work out. What did you learn?",
        a: "STAR template — pick a real decision with a genuine miss (not a disguised humble-brag). Be honest about the wrong assumption, show the data/signal that revealed it, and end with a concrete change in how you decide things now. Authenticity matters more than a 'perfect' story." },
      { q: "Tell me about a time you had to align Product, Compliance, and Engineering on a tight regulatory deadline.",
        a: "STAR template — Situation: the deadline and competing priorities across teams. Task: your role in alignment. Action: how you ran the conversation (shared doc, working sessions, trade-off framing). Result: outcome and relationship impact. Draw on your actual eNACH/BBPS regulatory work for specifics." },
      { q: "Describe a situation where you had incomplete data but still had to make a call.",
        a: "STAR template — name the missing data explicitly, the deadline pressure, your reasoning for a directional call vs. waiting, and how you mitigated risk (fast rollback plan, phased rollout). Show judgment, not recklessness." },
      { q: "Tell me about a time you influenced without direct authority.",
        a: "STAR template — a peer team or senior stakeholder you needed buy-in from without reporting authority. Focus the Action on the specific influence tactic: data, relationship-building, incremental wins, or framing their incentive. Fill with your own APB experience." },
      { q: "Tell me about a time you had to make a decision that was right for the business but unpopular with your team.",
        a: "STAR template — pick a real moment (deprioritizing a feature the team was excited about, or holding a hard deadline). Focus the Action on how you communicated the 'why' transparently and involved the team in the how, even when the what wasn't up for debate. Result: team morale/trust impact and what you'd do differently." },
      { q: "Describe a time you had to mentor or unblock a junior PM or cross-functional partner who was struggling.",
        a: "STAR template — be specific about what 'struggling' looked like (missed deadlines, unclear prioritization, stakeholder friction), your diagnostic approach before jumping to solutions, and a concrete change in their output/confidence as the result." },
      { q: "Tell me about a product you shipped that you later had to sunset or significantly pivot. Walk through your decision-making.",
        a: "STAR template — be honest about the signal that told you it wasn't working (usage data, unit economics, market shift), how you built the case to stakeholders/leadership to pivot or kill it (often harder than launching), and what you'd validate earlier next time." },
      { q: "Describe a time you had a major disagreement with an engineering lead over product or system architecture. How did you resolve it?",
        a: "STAR template — Situation: what the architectural disagreement was and why it mattered (cost, timeline, scalability, compliance risk). Task: your role in resolving it without just pulling rank. Action: how you got specific — pushed both sides to lay out trade-offs against a shared set of constraints (launch date, data volume, regulatory need) rather than arguing preferences, possibly with a time-boxed prototype or data point to settle it. Result: what was decided, whether it held up, and how the working relationship fared afterward.",
        source: "reported", addedDate: "2026-08-29" },
      { q: "Tell me about a time you had to make a critical product decision under pressure. What was your decision-making process and the outcome?",
        a: "STAR template — Situation: what forced urgency (an outage, a launch deadline, a stakeholder ultimatum). Task: your specific decision authority/role in that moment. Action: what information you used given the time constraint, who you looped in vs. decided solo, and why. Result: outcome and what you'd do differently with hindsight — interviewers weight the reasoning process here more than whether the outcome was perfect.",
        source: "reported", addedDate: "2026-09-02" },
      { q: "Describe a time you disagreed with your manager's product priority call and had to decide whether to escalate, comply, or find a third path.",
        a: "STAR template — Situation: the specific priority disagreement and what was at stake. Task: your options (comply silently, escalate over their head, or find a third path). Action: focus on how you made your case with data/reasoning rather than just pushing back on authority, and how you decided the disagree-and-commit line — at what point you'd have escalated if unresolved. Result: what was decided and how the working relationship held up afterward.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Tell me about a time a regulator or compliance team blocked something you had already committed to a customer or partner. How did you handle it?",
        a: "STAR template — Situation: what was already committed externally and why compliance blocked it. Task: your role in resolving the conflict between an external commitment and an internal blocker. Action: how you communicated the delay to the customer/partner without burning trust, and what you did internally to either find a compliant path or genuinely reset expectations. Result: relationship and timeline outcome, and what you'd validate with compliance earlier next time.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Describe a time you had to say no to a big customer or partner's feature request without damaging the relationship.",
        a: "STAR template — Situation: the request and why it wasn't right for the broader product/roadmap. Task: balancing the relationship value against the cost of a one-off build. Action: how you said no with a reason the partner could actually accept — ideally offering an alternative that serves their underlying need without the specific ask. Result: relationship outcome, and whether the alternative held up.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Tell me about the hardest trade-off you've had to make between user trust and short-term growth.",
        a: "STAR template — Situation: a specific moment where a growth lever (aggressive limits, opt-out defaults, monetized data use) tensioned with user trust. Task: your role in deciding. Action: how you weighed it — what data or principle tipped the decision, and who you brought into the conversation (legal, design, leadership). Result: what you chose, the actual outcome, and how you'd draw the line differently next time if at all.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Tell me about a product you built that met the most resistance. How did you overcome it?",
        a: "STAR template — Situation: name the specific resistance (from engineering, a stakeholder, or the market/users themselves) and why it existed — often a legitimate concern, not just inertia. Task: your role in getting the product through. Action: how you addressed the resistance directly — data that changed minds, a scoped-down pilot to de-risk the concern, or genuinely incorporating the pushback into a better version of the product rather than steamrolling it. Result: outcome, and whether the resistance turned out to have been right about something you should have listened to earlier.",
        source: "reported", addedDate: "2026-09-03" },
      { q: "Tell me about a time you had to deliver bad news — a delay, a cut feature, a missed target — to a stakeholder who was counting on you.",
        a: "STAR template — Situation: what was promised and why it slipped. Task: your responsibility in the delivery of that message, not just the underlying miss. Action: focus on how you delivered it (proactively vs. waiting to be asked, with a concrete revised plan rather than just an apology) and how you handled their reaction. Result: relationship outcome and whether trust was actually preserved or just patched over — interviewers are listening for whether you take ownership rather than deflecting to 'engineering was late.'",
        source: "claude", addedDate: "2026-09-04" },
      { q: "Tell me about a time you cut scope or unblocked a team to ship faster, without sacrificing quality.",
        a: "STAR template — Situation: what was at risk of slipping and why speed mattered (a market window, a committed date, team morale). Task: your role in the trade-off. Action: be specific about what you actually cut (a feature, a polish pass, a nice-to-have edge case) versus what you protected (core reliability, security, data integrity) — this is the part interviewers are really listening for, since 'we just moved faster' without naming the trade-off sounds like corner-cutting, not judgment. Result: outcome, and how you validated that what you cut didn't quietly become a problem later.",
        source: "reported", addedDate: "2026-09-06" },
      { q: "Tell me about a time you dealt with a bug or product issue where trust or correctness was on the line. How did you handle it?",
        a: "STAR template — Situation: what the issue was and why it specifically threatened trust or correctness, not just convenience (a miscalculated balance, a wrongly-declined transaction, data shown to the wrong user). Task: your role in the response, especially if you weren't the one who caused it. Action: focus on the sequencing — how fast you communicated transparently versus how fast you actually fixed it, since these interviews are testing whether you protect trust even under pressure to look competent. Result: outcome, and whether the incident changed any process to prevent a repeat, not just a one-time patch.",
        source: "reported", addedDate: "2026-09-08" },
      { q: "Tell me about a time you had to give critical feedback to a peer or stakeholder whose work directly affected your product's success.",
        a: "STAR template — Situation: whose work and why the gap mattered enough to address directly rather than work around. Task: your responsibility here, especially if you had no formal authority over them. Action: focus on how you framed the feedback to be actionable rather than just critical — tied to a specific outcome, not personality — and how you followed up rather than treating one conversation as sufficient. Result: whether the relationship and the work actually improved, and what you'd do differently in the delivery next time.",
        source: "claude", addedDate: "2026-09-09" },
      { q: "Tell me about a time your project's priorities changed midway through, after you'd already committed resources and communicated a plan to your team. How did you handle it?",
        a: "STAR template — Situation: what changed and why (a leadership call, new data, an external event) and what had already been committed. Task: your responsibility in managing the pivot without losing team trust or momentum. Action: focus on how you re-communicated the change — transparently naming what triggered it rather than pretending the original plan was always wrong — and how you helped the team salvage any work already in progress rather than treating it as wasted. Result: team morale and delivery outcome, and what you'd do differently to catch the change earlier next time.",
        source: "reported", addedDate: "2026-09-10" }
    ]
  },
  fintech_domain: {
    label: "Fintech Domain (bonus)",
    questions: [
      { q: "Explain the difference between BOU and COU in the BBPS ecosystem.",
        a: "BOU (Biller Operating Unit) onboards and integrates billers (electricity boards, telcos, etc.) onto the BBPS network. COU (Customer Operating Unit) is the customer-facing entity — banks, wallets, apps — that lets end customers discover and pay those bills. One connects billers in, the other lets customers pay out." },
      { q: "Walk through the eNACH mandate lifecycle as a destination bank.",
        a: "Customer initiates mandate (via net-banking/debit card/Aadhaar-based auth) → mandate details registered and stored with NPCI → for each billing cycle, a debit is presented against the mandate → destination bank validates and authorizes/declines based on mandate terms and balance → settlement occurs → dispute/complaint handling if a debit is contested." },
      { q: "What changed in RBI's e-mandate framework for recurring payments, and why?",
        a: "Broadly: additional factor authentication (AFA) requirements for recurring debits above a threshold, mandatory pre-debit notification to the customer ahead of each auto-debit, and relaxed/simplified authentication for small-value transactions below a threshold. Intent: balance fraud prevention with friction-free recurring payments. Verify exact current thresholds against the latest RBI circular before quoting numbers in an interview." },
      { q: "How does Account Aggregator differ from BBPS/NACH data flows?",
        a: "Account Aggregator is a consent-based framework for sharing financial *data* across institutions (statements, holdings) — it doesn't move money. BBPS and NACH are payment *execution* rails — BBPS for bill collection, NACH for recurring debits/credits. AA can inform decisions (e.g., credit underwriting); BBPS/NACH actually move the money." },
      { q: "What obligations does a destination bank hold in an eNACH transaction chain?",
        a: "Validate mandate authenticity before honoring a debit, execute the debit per the exact mandate terms (amount/frequency/date), perform balance checks, adhere to NPCI-mandated turnaround times for authorization/response, and handle customer disputes/complaints within regulatory timelines." },
      { q: "Explain how alternative data-based credit underwriting works and its risks.",
        a: "Uses non-traditional signals — utility bill payments, gig-platform earnings, phone/app usage patterns, bank transaction history via Account Aggregator — to assess creditworthiness for thin-file customers who lack traditional credit history. Risk: model bias if alternative signals correlate indirectly with protected attributes (e.g. phone model as a wealth proxy), and lower explainability for regulators/customers when a loan is denied on non-obvious grounds." },
      { q: "How does an insurtech's distribution model typically differ (agent-led vs. digital-direct vs. embedded/bancassurance)?",
        a: "Agent-led: high-touch, better for complex products (life/health) needing trust and explanation, but high cost-per-acquisition and slow scale. Digital-direct: low-cost, scalable, works for simple/commoditized products (travel, device insurance) where the trust barrier is lower. Embedded (bundled at checkout): highest conversion since it rides existing purchase intent, but needs strong underwriting automation since there's no agent to manually assess risk." },
      { q: "What is Banking-as-a-Service (BaaS) and how does it change the fintech competitive landscape?",
        a: "BaaS lets non-bank companies embed regulated banking products (accounts, cards, lending) via API, using a licensed bank's infrastructure/license behind the scenes. It lowers the barrier for any company to become a fintech distributor, shifting competition from 'who holds a banking license' to 'who owns the best customer distribution and experience' — banks become infrastructure, and value capture moves toward the customer-facing brand." },
      { q: "Compare SWIFT-based cross-border payments to newer real-time cross-border rails.",
        a: "SWIFT is a messaging network, not a settlement rail — correspondent banks in the chain each take a cut and add delay (1-5 days), with limited transparency on final amount/fees. Newer rails (real-time settlement partnerships, or regional real-time-payment interlinking like UPI-PayNow) cut intermediary hops for near-instant settlement and upfront fee/FX transparency, but typically have narrower corridor/currency coverage than SWIFT's near-universal reach." },
      { q: "Explain credit card interchange economics — who pays whom and why it matters for product strategy.",
        a: "The merchant's bank pays an interchange fee to the cardholder's issuing bank on each transaction (roughly 1-3%), funded by the merchant discount rate the merchant pays. This is why issuers can offer rewards/cashback (funded by interchange), and why low-margin merchants (fuel, groceries) push back on card fees or prefer UPI/direct-debit rails with near-zero MDR. Implication: a card product's rewards strategy is fundamentally bounded by its interchange economics, not just user delight." },
      { q: "A junior PM on your team says 'let's just use UPI AutoPay for everything recurring — it's free and instant.' Where does that break down?",
        a: "UPI AutoPay has per-transaction/per-category debit limits and mandate-execution windows unsuitable for large-ticket recurring payments like EMIs or insurance premiums above the threshold — NACH/eNACH remains necessary there. AutoPay also inherits UPI's dependency on the payer's bank/PSP uptime for each execution, which can be less predictable for a lender needing guaranteed batch settlement timing. The right call is workload-dependent: AutoPay for low-value, high-frequency debits where instant UX matters, NACH for higher-value or compliance-sensitive recurring debits where deterministic batch settlement matters more than speed.",
        source: "claude", addedDate: "2026-08-29" },
      { q: "Explain how a BNPL provider like Klarna or Affirm actually makes money, and what happens to that economics if a regulator classifies BNPL as regulated credit.",
        a: "BNPL providers earn primarily from merchant discount fees (a cut of GMV, often higher than card interchange, because merchants pay for the conversion/AOV lift), plus late fees and, on longer-tenor plans, interest from consumers. If regulated as credit, providers face mandatory affordability checks, credit bureau reporting, and disclosure requirements — this raises compliance cost and slows approval speed (BNPL's core UX advantage), and may push smaller/thinner-margin players out while entrenching well-capitalized incumbents who can absorb the compliance cost.",
        source: "reported", addedDate: "2026-09-02" },
      { q: "What's the difference between a Payment Aggregator (PA) and a Payment Gateway (PG) under RBI's framework, and why does it matter for who a fintech needs a license as?",
        a: "A Payment Aggregator holds/settles merchant funds and takes on custody of money in the flow, so it needs an RBI PA license with net-worth and safeguarding requirements. A Payment Gateway is purely a technical pass-through — it routes the transaction but never holds the funds — so it doesn't need a PA license on its own. This matters because a fintech offering merchant checkout needs to know which role it's actually playing (or whether a partner PA/PG handles that layer) before assuming it can operate without a license.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Explain how a co-lending / co-origination arrangement between a bank and an NBFC typically works, and what risk each party retains.",
        a: "In co-lending, the bank and NBFC jointly originate a loan on pre-agreed terms, typically splitting the funding (RBI's framework generally requires the bank to hold at least 20% on its own books) — the NBFC usually brings the origination/underwriting model and customer relationship (often in underserved segments), the bank brings lower-cost capital and balance sheet scale. Risk-sharing follows funding share, but the NBFC typically retains more operational/reputational exposure since it owns the customer relationship, and first-loss default guarantee arrangements are often negotiated on top.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "What is FedNow / RTP-style instant settlement, and how does it change working capital needs for a payments business compared to ACH-style batch settlement?",
        a: "FedNow/RTP settle transactions in seconds, 24/7, with finality — versus ACH's batch cycles that can take 1-3 business days and only run on business days. For a payments business, instant settlement compresses the working-capital gap between collecting from a payer and having usable funds, reducing the float/reserve you need to hold to cover pending settlements. The tradeoff: instant rails are typically push-payment only (harder to reverse), so fraud/dispute handling has to shift left — you can't rely on the settlement delay as a de facto fraud-review window anymore.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Explain tokenization in the context of card payments, and why it matters for both fraud and regulatory compliance (e.g. RBI's card-on-file tokenization mandate).",
        a: "Tokenization replaces the actual card number with a merchant/device-specific token that's useless if intercepted elsewhere, so a data breach at one merchant doesn't expose the underlying card everywhere else. RBI's card-on-file tokenization mandate specifically bars merchants from storing raw card numbers at all, forcing the ecosystem toward token-based recurring billing — this reduces systemic breach impact but adds implementation complexity (each merchant relationship needs its own token, complicating card updates/expiry handling) that fintechs building recurring billing products have to solve for directly.",
        source: "claude", addedDate: "2026-09-02" },
      { q: "Walk through what actually happens, system by system, when a customer swipes their card at a merchant terminal.",
        a: "The terminal captures card data and sends it to the merchant's acquiring bank, which routes it through the card network (Visa/Mastercard/RuPay) to the issuing bank for authorization — the issuer checks funds/credit limit and fraud rules, then sends an approve/decline back through the same chain, typically in under a second. Authorization isn't settlement: the actual movement of money happens later in a batch (the merchant's acquirer and the issuer settle net amounts, often next business day), which is why a merchant sees a transaction as 'pending' before it's fully settled. Each hop (terminal, acquirer, network, issuer) can independently decline or add latency, which is why 'my card got declined' can have a completely different root cause depending on which party in the chain rejected it.",
        source: "reported", addedDate: "2026-09-05" },
      { q: "What is a 'nostro/vostro' account relationship, and why does it matter for cross-border payment product design?",
        a: "A nostro account is 'our money held at your bank' (from the perspective of the bank holding it abroad); the same account is a vostro account from the foreign bank's perspective ('your money held at our bank') — these correspondent banking relationships are how banks settle cross-border payments without moving physical cash. For product design, this matters because settlement speed and cost are bounded by how many nostro/vostro hops a payment takes and how well-funded each account is — a payment can be authorized instantly but still take days to settle if it routes through a thinly-funded correspondent relationship, which is exactly the kind of hidden dependency that breaks a 'real-time transfer' promise.",
        source: "claude", addedDate: "2026-09-06" },
      { q: "What's the difference between a 'hard pull' and a 'soft pull' credit inquiry, and why does this distinction matter for product design in a lending or credit-monitoring app?",
        a: "A hard pull is logged by credit bureaus and can slightly lower a score (signals active credit-seeking behavior to future lenders); a soft pull isn't visible to other lenders and doesn't affect the score, typically used for pre-qualification or a user checking their own report. This matters for product design because leading with pre-qualification via soft pull (showing likely approval odds before a hard pull) reduces application abandonment from score-anxious users, while any flow that triggers a hard pull needs very explicit, unambiguous consent to avoid trust-damaging surprises on the user's credit report.",
        source: "claude", addedDate: "2026-09-08" },
      { q: "What is 'chargeback liability shift,' and how does EMV chip adoption relate to who bears fraud losses on a disputed in-person transaction?",
        a: "Liability shift means whichever party has the lesser fraud-prevention technology in a transaction bears the loss if it turns out to be fraudulent — post-EMV rollout, if a merchant hasn't upgraded to chip-reading terminals but the card is chip-enabled, liability for card-present fraud shifts from the issuer to the merchant. This was designed to incentivize merchant-side EMV adoption by making the cost of not upgrading concrete and immediate, rather than an abstract security recommendation. For product design, this matters when building merchant-facing fraud tooling — the terminal/acceptance-method used isn't just a UX choice, it directly determines who eats a fraud loss on any given disputed transaction.",
        source: "claude", addedDate: "2026-09-10" }
    ]
  },
  strategy: {
    label: "Strategy (bonus)",
    questions: [
      { q: "Should your BBPS platform build its own consumer-facing bill-pay app, or stay purely a backend rail for banks/wallets to plug into?",
        a: "Frame as build-vs-stay-infra: a consumer app puts you in direct competition with your own COU partners (banks, PhonePe, GPay) — channel conflict risk. Staying infra-only keeps you the neutral rail everyone builds on, compounding distribution without owning acquisition cost. Recommend staying infra-first unless a clear underserved segment (e.g. no COU covers a biller category) justifies a narrow, non-competing wedge product." },
      { q: "NPCI is considering opening UPI AutoPay mandates to a new class of use cases (e.g. SIP/EMI). How would you decide whether to prioritize supporting this on your platform?",
        a: "Size the opportunity (TAM of SIP/EMI recurring volume vs. existing bill-pay volume), assess build cost (does it fit existing mandate infra or need new rails/compliance work), and check strategic fit (does it reinforce your core rail position or pull you into a new regulated vertical with new risk). Recommend a phased pilot with 1-2 partner banks before a full platform commitment, gated on measured mandate-success and dispute rates." },
      { q: "A competitor payment rail is undercutting your BOU onboarding fees to win billers. How do you respond?",
        a: "Don't default to a price war — check whether billers are switching purely on price or also on integration ease/reliability/settlement speed. If price-sensitive segment is small/low-margin, let it go and defend on service quality for higher-value billers. If broad-based, consider a tiered pricing model (volume-based discounts) rather than blanket cuts, preserving margin on your core base while staying competitive at the edges." },
