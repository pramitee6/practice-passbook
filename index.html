        a: "Structure the explanation around purpose limitation and data minimization — a regulator wants to hear that you collect only the specific data needed for the stated purpose (e.g. account verification, not indefinite behavioral profiling) and that you can name the explicit legal basis for each category of data you process (consent, contract necessity, legitimate interest), not just 'we need it for the product to work.' Be able to state concretely how long data is retained and why, what happens to it if a user withdraws consent or closes their account (deletion vs. anonymization vs. required regulatory retention), and who else the data is shared with (sub-processors, partner banks) since GDPR treats onward sharing as a separate disclosure obligation. The strongest answers also show awareness that 'we comply' isn't enough — a regulator is testing whether you can demonstrate compliance through documentation (a data processing register, a completed DPIA for higher-risk processing) rather than just asserting it in conversation.",
        source: "reported", addedDate: "2026-09-24" }
    ]
  }
};

const SCHEDULE = { 1: "execution", 3: "analytics", 5: "behavioral", 6: "product_sense" };
// 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat

const STORE_KEY = "pm-prep-state-v1";
let state = null;
let activeTopicKey = null;
let lastRevealed = null;

function todayStr(d = new Date()) {
  return d.toISOString().slice(0,10);
}
function dayName(d) {
  return d.toLocaleDateString('en-US', { weekday: 'short' });
}

async function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.answeredQuestions) parsed.answeredQuestions = [];
      return parsed;
    }
  } catch(e) {}
  return {
    streak: 0,
    best: 0,
    lastPracticedDate: null,
    qIndex: { product_sense:0, execution:0, analytics:0, behavioral:0, fintech_domain:0, strategy:0, rca:0, gtm:0, faq:0 },
    log: [],
    stampDates: [],
    answeredQuestions: []
  };
}

function pruneOldAnsweredQuestions() {
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 4);
  const cutoffStr = todayStr(cutoff);
  state.answeredQuestions = (state.answeredQuestions || []).filter(e => e.date >= cutoffStr);
}

async function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch(e) { console.error("save failed", e); }
}

function scheduledDaysBetween(fromDate, toDate) {
  // returns list of scheduled weekday numbers strictly between fromDate(exclusive) and toDate(inclusive)
  let count = 0;
  let d = new Date(fromDate);
  d.setDate(d.getDate() + 1);
  while (d <= toDate) {
    if (SCHEDULE[d.getDay()] && todayStr(d) !== todayStr(toDate)) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

function checkStreakBreak() {
  if (!state.lastPracticedDate) return;
  const last = new Date(state.lastPracticedDate);
  const today = new Date();
  today.setHours(0,0,0,0);
  last.setHours(0,0,0,0);
  const missed = scheduledDaysBetween(last, today);
  if (missed > 0) {
    state.streak = 0;
  }
}

function getTopicForToday() {
  const dow = new Date().getDay();
  return SCHEDULE[dow] || null;
}

function render() {
  document.getElementById('streakNum').textContent = state.streak;
  document.getElementById('bestNum').textContent = state.best;

  // stamp row - last 8 scheduled sessions
  const stampRow = document.getElementById('stampRow');
  stampRow.innerHTML = '';
  const recent = state.stampDates.slice(-8);
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'stamp' + (recent[i] ? ' done' : '');
    s.textContent = recent[i] ? '✓' : '';
    stampRow.appendChild(s);
  }

  const todayKey = getTopicForToday();
  const scheduledToday = !!todayKey;
  const doneToday = state.lastPracticedDate === todayStr();

  const todayCount = state.log.filter(e => e.date === todayStr()).length;

  let nextTxt = '';
  if (doneToday) {
    nextTxt = todayCount + (todayCount === 1 ? " question" : " questions") + " logged today. Next scheduled: " + nextScheduledLabel();
  } else if (scheduledToday) {
    nextTxt = "Scheduled today — " + TOPICS[todayKey].label;
  } else {
    nextTxt = "Free day. Next scheduled: " + nextScheduledLabel();
  }
  document.getElementById('nextLine').innerHTML = nextTxt;

  activeTopicKey = todayKey || activeTopicKey || 'product_sense';
  renderTopicCard(doneToday);
  renderLog();
  renderTopicSelect();

  document.getElementById('moreCard').style.display = doneToday ? 'block' : 'none';
  renderMoreSelect();
}

function populateTopicSelect(sel) {
  if (sel.options.length === 0) {
    Object.keys(TOPICS).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = TOPICS[key].label;
      sel.appendChild(opt);
    });
  }
}

function renderTopicSelect() {
  const sel = document.getElementById('topicSelect');
  populateTopicSelect(sel);
  sel.value = activeTopicKey;
}

function renderMoreSelect() {
  const sel = document.getElementById('moreTopicSelect');
  populateTopicSelect(sel);
  sel.value = activeTopicKey;
}

function nextScheduledLabel() {
  let d = new Date();
  for (let i = 1; i <= 7; i++) {
    d.setDate(d.getDate() + 1);
    if (SCHEDULE[d.getDay()]) {
      return dayName(d) + " · " + TOPICS[SCHEDULE[d.getDay()]].label;
    }
  }
  return '';
}

function formatBadgeDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: '2-digit' });
}

function sourceBadge(item) {
  if (!item.source) return '';
  const label = item.source === 'reported' ? 'Reported' : 'Claude practice';
  const dateLabel = formatBadgeDate(item.addedDate);
  return ' · ' + label + (dateLabel ? ' · ' + dateLabel : '');
}

function createQuestionBlock(key, idx, autoReveal) {
  const topic = TOPICS[key];
  const item = topic.questions[idx];
  const block = document.createElement('div');
  block.className = 'q-block';
  block.innerHTML =
    '<span class="qn">Q' + (idx+1) + ' of ' + topic.questions.length + sourceBadge(item) + '</span>' +
    '<div class="q-text">' + item.q + '</div>' +
    '<button class="reveal-btn" type="button">Show model answer</button>' +
    '<div class="a-text" style="display:none;">' + item.a + '</div>';
  const revealBtn = block.querySelector('.reveal-btn');
  const aText = block.querySelector('.a-text');
  revealBtn.addEventListener('click', () => {
    const showing = aText.style.display !== 'none';
    aText.style.display = showing ? 'none' : 'block';
    revealBtn.textContent = showing ? 'Show model answer' : 'Hide model answer';
  });
  if (autoReveal) {
    aText.style.display = 'block';
    revealBtn.textContent = 'Hide model answer';
  }
  return block;
}

function renderTopicCard(doneToday) {
  const key = activeTopicKey;
  const topic = TOPICS[key];
  document.getElementById('topicTag').textContent = getTopicForToday() === key ? "TODAY'S TOPIC" : "PRACTICING";
  document.getElementById('topicHeading').textContent = topic.label;

  const qArea = document.getElementById('questionArea');
  qArea.innerHTML = '';

  const justMarked = doneToday && getTopicForToday() === key && lastRevealed && lastRevealed.key === key;

  if (doneToday && getTopicForToday() === key) {
    const banner = document.createElement('div');
    banner.className = 'done-banner';
    banner.textContent = "✓ Practiced today — streak: " + state.streak + " days";
    qArea.appendChild(banner);
  }

  const idx = justMarked ? lastRevealed.idx : (state.qIndex[key] % topic.questions.length);
  qArea.appendChild(createQuestionBlock(key, idx, !!justMarked));

  const markBtn = document.getElementById('markBtn');
  markBtn.disabled = doneToday;
  markBtn.textContent = doneToday ? "Streak already logged today" : "Mark session practiced";
}

function renderLog() {
  const logList = document.getElementById('logList');
  logList.innerHTML = '';
  if (state.log.length === 0) {
    logList.innerHTML = '<div class="log-empty">No entries yet — your first stamp goes here.</div>';
    return;
  }
  const recent = [...state.log].reverse().slice(0, 12);
  recent.forEach(entry => {
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = '<span class="d">' + entry.date + '</span><span class="t">' + entry.topic + (entry.note ? ' — ' + escapeHtml(entry.note) : '') + '</span>';
    logList.appendChild(row);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function recordAnsweredQuestion(key, idx, date) {
  state.answeredQuestions = (state.answeredQuestions || []).filter(e => !(e.key === key && e.idx === idx));
  state.answeredQuestions.push({ key: key, idx: idx, date: date });
  pruneOldAnsweredQuestions();
}

document.getElementById('markBtn').addEventListener('click', async () => {
  const key = activeTopicKey;
  const topic = TOPICS[key];
  const today = todayStr();
  if (state.lastPracticedDate === today) return;

  const note = document.getElementById('noteField').value.trim();
  const answeredIdx = state.qIndex[key] % topic.questions.length;

  state.streak += 1;
  state.best = Math.max(state.best, state.streak);
  state.lastPracticedDate = today;
  state.qIndex[key] = (state.qIndex[key] + 1) % topic.questions.length;
  state.log.push({ date: today, topic: topic.label, note: note });
  state.stampDates.push(today);
  recordAnsweredQuestion(key, answeredIdx, today);

  lastRevealed = { key: key, idx: answeredIdx };

  document.getElementById('noteField').value = '';
  await saveState();
  render();
});

document.getElementById('moreBtn').addEventListener('click', async () => {
  const key = document.getElementById('moreTopicSelect').value;
  const topic = TOPICS[key];
  const idx = state.qIndex[key] % topic.questions.length;
  state.qIndex[key] = (state.qIndex[key] + 1) % topic.questions.length;
  state.log.push({ date: todayStr(), topic: topic.label, note: '' });
  recordAnsweredQuestion(key, idx, todayStr());
  await saveState();

  activeTopicKey = key;
  lastRevealed = { key: key, idx: idx };
  document.getElementById('topicTag').textContent = "EXTRA — " + topic.label.toUpperCase();
  document.getElementById('topicHeading').textContent = topic.label;
  const qArea = document.getElementById('questionArea');
  qArea.innerHTML = '';
  qArea.appendChild(createQuestionBlock(key, idx, true));
  qArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
  renderLog();
  document.getElementById('nextLine').innerHTML = (state.log.filter(e => e.date === todayStr()).length) + " questions logged today. Next scheduled: " + nextScheduledLabel();
});

document.getElementById('topicSelect').addEventListener('change', (e) => {
  activeTopicKey = e.target.value;
  renderTopicCard(state.lastPracticedDate === todayStr() && getTopicForToday() === activeTopicKey);
  renderMoreSelect();
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('Reset all streak and log data?')) return;
  state = {
    streak: 0, best: 0, lastPracticedDate: null,
    qIndex: { product_sense:0, execution:0, analytics:0, behavioral:0, fintech_domain:0, strategy:0, rca:0, gtm:0, faq:0 },
    log: [], stampDates: [], answeredQuestions: []
  };
  await saveState();
  render();
});

function expiryLabel(dateStr) {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + 4);
  return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderLibrary() {
  pruneOldAnsweredQuestions();
  const lib = document.getElementById('libraryView');
  lib.innerHTML = '';

  const answered = state.answeredQuestions || [];
  if (answered.length === 0) {
    lib.innerHTML = '<div class="log-empty" style="color:#B9C2D6;">No questions answered yet. Once you mark a session practiced, it shows up here — and stays for 4 months.</div>';
    return;
  }

  const byTopic = {};
  answered.forEach(e => {
    if (!byTopic[e.key]) byTopic[e.key] = [];
    byTopic[e.key].push(e);
  });

  Object.keys(TOPICS).forEach(key => {
    if (!byTopic[key]) return;
    const topic = TOPICS[key];
    const entries = byTopic[key].sort((a,b) => b.date.localeCompare(a.date));

    const section = document.createElement('div');
    section.className = 'lib-topic';
    const title = document.createElement('div');
    title.className = 'lib-topic-title';
    title.textContent = topic.label;
    section.appendChild(title);

    entries.forEach(e => {
      const item = topic.questions[e.idx];
      if (!item) return;
      const box = document.createElement('div');
      box.className = 'lib-q';
      box.innerHTML =
        '<span class="qn">Answered ' + e.date + ' · in library till ' + expiryLabel(e.date) + sourceBadge(item) + '</span>' +
        '<div class="q-text">' + item.q + '</div>' +
        '<button class="reveal-btn" type="button">Show model answer</button>' +
        '<div class="a-text" style="display:none;">' + item.a + '</div>';
      const revealBtn = box.querySelector('.reveal-btn');
      const aText = box.querySelector('.a-text');
      revealBtn.addEventListener('click', () => {
        const showing = aText.style.display !== 'none';
        aText.style.display = showing ? 'none' : 'block';
        revealBtn.textContent = showing ? 'Show model answer' : 'Hide model answer';
      });
      section.appendChild(box);
    });
    lib.appendChild(section);
  });
}

document.getElementById('tabToday').addEventListener('click', () => {
  document.getElementById('tabToday').classList.add('active');
  document.getElementById('tabLibrary').classList.remove('active');
  document.getElementById('todayView').style.display = 'block';
  document.getElementById('libraryView').style.display = 'none';
});

document.getElementById('tabLibrary').addEventListener('click', () => {
  document.getElementById('tabLibrary').classList.add('active');
  document.getElementById('tabToday').classList.remove('active');
  document.getElementById('todayView').style.display = 'none';
  document.getElementById('libraryView').style.display = 'block';
  renderLibrary();
});

(async function init() {
  state = await loadState();
  checkStreakBreak();
  pruneOldAnsweredQuestions();
  await saveState();
  render();
})();
</script>
</body>
</html>
