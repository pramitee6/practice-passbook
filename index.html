<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Passbook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#0F1A30;
  --bg-alt:#16233F;
  --paper:#FBF7EC;
  --paper-line:#E6DCC3;
  --ink:#221F1A;
  --gold:#C9A227;
  --gold-deep:#8C6D1F;
  --stamp:#A63D30;
  --muted:#6E6656;
  --success:#2F6B3E;
  --success-bg:#E6EFE3;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(ellipse at top, var(--bg-alt), var(--bg) 70%);
  font-family:'Inter',sans-serif;
  color:var(--ink);
  min-height:100vh;
  padding:20px 14px 60px;
}
.wrap{max-width:460px;margin:0 auto;}

.masthead{
  text-align:center;
  color:var(--paper);
  margin-bottom:18px;
}
.masthead .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:4px;
}
.masthead h1{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:28px;
  margin:0;
  letter-spacing:0.3px;
}
.masthead p{
  font-size:12.5px;
  color:#B9C2D6;
  margin:4px 0 0;
}

/* Passbook card */
.passbook{
  background:var(--paper);
  border-radius:4px;
  box-shadow:0 18px 40px rgba(0,0,0,0.35), inset 0 0 0 1px var(--paper-line);
  padding:22px 20px 18px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.passbook::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:8px;
  background:repeating-linear-gradient(0deg,var(--gold-deep) 0 3px, transparent 3px 9px);
  opacity:0.5;
}
.passbook-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:1px dashed var(--paper-line);
  padding-bottom:14px;
  margin-bottom:14px;
}
.streak-num{
  font-family:'Fraunces',serif;
  font-size:46px;
  font-weight:700;
  line-height:1;
  color:var(--stamp);
}
.streak-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:4px;
}
.best-badge{
  text-align:right;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
}
.best-badge b{color:var(--ink);font-size:15px;display:block;}

.stamp-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.stamp{
  width:30px;height:30px;
  border-radius:50%;
  border:2px solid var(--paper-line);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  color:var(--paper-line);
  font-family:'JetBrains Mono',monospace;
  flex-shrink:0;
}
.stamp.done{
  border-color:var(--stamp);
  color:var(--stamp);
  transform:rotate(-8deg);
  font-weight:700;
}

.next-line{
  font-size:12.5px;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}
.next-line b{color:var(--ink);}

/* Today card */
.card{
  background:var(--paper);
  border-radius:4px;
  box-shadow:0 10px 24px rgba(0,0,0,0.28), inset 0 0 0 1px var(--paper-line);
  padding:20px;
  margin-bottom:16px;
}
.card-tag{
  display:inline-block;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gold-deep);
  background:#F3E9C9;
  padding:3px 9px;
  border-radius:2px;
  margin-bottom:10px;
}
.card h2{
  font-family:'Fraunces',serif;
  font-size:19px;
  margin:0 0 12px;
}
.q-block{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:3px;
  padding:12px 14px;
  margin-bottom:10px;
  font-size:14px;
  line-height:1.5;
}
.q-block .qn{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--gold-deep);
  margin-bottom:4px;
  display:block;
}
select, textarea{
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  padding:9px 10px;
  border:1px solid var(--paper-line);
  border-radius:3px;
  background:#fff;
  color:var(--ink);
  margin-bottom:10px;
}
textarea{resize:vertical;min-height:60px;}
button{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13.5px;
  border:none;
  border-radius:3px;
  padding:11px 16px;
  cursor:pointer;
  width:100%;
}
.btn-primary{
  background:var(--ink);
  color:var(--paper);
}
.btn-primary:disabled{
  background:#B9B2A0;
  cursor:default;
}
.btn-secondary{
  background:transparent;
  color:var(--muted);
  border:1px solid var(--paper-line);
  margin-top:8px;
}
.done-banner{
  background:var(--success-bg);
  color:var(--success);
  font-size:13px;
  font-weight:600;
  padding:10px 12px;
  border-radius:3px;
  margin-bottom:10px;
}

/* Log */
.log-title{
  color:var(--paper);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:22px 0 8px 4px;
}
.log-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 4px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:12.5px;
  color:#C7CEDE;
}
.log-row .d{font-family:'JetBrains Mono',monospace;color:var(--gold);flex-shrink:0;}
.log-row .t{flex:1;color:#EDEFF5;}
.log-empty{
  color:#7C859C;
  font-size:12.5px;
  padding:10px 4px;
  font-style:italic;
}
.reset-link{
  text-align:center;
  margin-top:20px;
}
.reset-link button{
  background:none;
  color:#7C859C;
  font-size:11px;
  text-decoration:underline;
  width:auto;
  padding:4px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="eyebrow">Fintech PM Track</div>
    <h1>Practice Passbook</h1>
    <p>Mon · Wed · Fri · Sat — evening entries</p>
  </div>

  <div class="passbook">
    <div class="passbook-header">
      <div>
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-label">day streak</div>
      </div>
      <div class="best-badge">
        <b id="bestNum">0</b>
        best streak
      </div>
    </div>
    <div class="stamp-row" id="stampRow"></div>
    <div class="next-line" id="nextLine">Loading…</div>
  </div>

  <div class="card" id="todayCard">
    <div class="card-tag" id="topicTag">TODAY</div>
    <h2 id="topicHeading">Loading…</h2>
    <div id="questionArea"></div>
    <textarea id="noteField" placeholder="Optional: jot a note on how it went…"></textarea>
    <button class="btn-primary" id="markBtn">Mark session practiced</button>
    <button class="btn-secondary" id="skipTopicBtn">Practice a different topic instead</button>
  </div>

  <div class="card" id="moreCard" style="display:none;">
    <div class="card-tag">EXTRA PRACTICE</div>
    <h2>Want another question today?</h2>
    <p style="font-size:13px;color:var(--muted);margin:-6px 0 12px;">Your streak's already counted for today — this just adds more reps.</p>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Topic</label>
    <select id="moreTopicSelect"></select>
    <button class="btn-primary" id="moreBtn">Give me another question</button>
  </div>

  <div class="log-title">Ledger</div>
  <div id="logList"></div>

  <div class="reset-link"><button id="resetBtn">Reset all data</button></div>
</div>

<script>
const TOPICS = {
  product_sense: {
    label: "Product Sense",
    questions: [
      "Design a bill payment reminder feature for BBPS users who frequently miss due dates.",
      "How would you improve the first-time NACH mandate creation flow?",
      "Redesign UPI AutoPay's mandate-pause experience.",
      "How would you help users recover from a failed eNACH mandate registration?",
      "Design a feature to reduce Digital Cancelled Cheque upload failures.",
      "How would you design an onboarding flow for a first-time BBPS biller?"
    ]
  },
  execution: {
    label: "Execution / Prioritization",
    questions: [
      "You have 3 engineers and 6 weeks. Prioritize: NACH failure-reason clarity, BBPS new biller onboarding, DCC OCR accuracy improvement. Justify your call.",
      "A key regulatory deadline (RBI mandate) conflicts with a revenue-driving feature launch. How do you sequence?",
      "Your BBPS COU integration is delayed by a partner dependency. Walk through how you'd manage the roadmap and stakeholders.",
      "How would you decide whether to build vs. buy for a new fraud-check module in DCC?",
      "Write a 1-week sprint plan for fixing a spike in eNACH mandate failures."
    ]
  },
  analytics: {
    label: "Analytics / Metrics",
    questions: [
      "Define success metrics for the BBPS bill reminder feature we designed earlier.",
      "eNACH mandate success rate dropped 8% last week. Walk through your root-cause approach.",
      "Estimate the number of BBPS bill payments processed daily in India.",
      "What metrics would you track for Digital Cancelled Cheque adoption in its first quarter?",
      "How would you set up an A/B test for a new NACH mandate UI?"
    ]
  },
  behavioral: {
    label: "Behavioral",
    questions: [
      "Tell me about a time you had to push back on a stakeholder's requirement. Use your eNACH/BBPS/DCC experience.",
      "Describe a time a product decision you made didn't work out. What did you learn?",
      "Tell me about a time you had to align Product, Compliance, and Engineering on a tight regulatory deadline.",
      "Describe a situation where you had incomplete data but still had to make a call.",
      "Tell me about a time you influenced without direct authority."
    ]
  },
  fintech_domain: {
    label: "Fintech Domain (bonus)",
    questions: [
      "Explain the difference between BOU and COU in the BBPS ecosystem.",
      "Walk through the eNACH mandate lifecycle as a destination bank.",
      "What changed in RBI's e-mandate framework for recurring payments, and why?",
      "How does Account Aggregator differ from BBPS/NACH data flows?",
      "What obligations does a destination bank hold in an eNACH transaction chain?"
    ]
  }
};

const SCHEDULE = { 1: "execution", 3: "analytics", 5: "behavioral", 6: "product_sense" };
// 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat

const STORE_KEY = "pm-prep-state-v1";
let state = null;
let activeTopicKey = null;

function todayStr(d = new Date()) {
  return d.toISOString().slice(0,10);
}
function dayName(d) {
  return d.toLocaleDateString('en-US', { weekday: 'short' });
}

async function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {
    streak: 0,
    best: 0,
    lastPracticedDate: null,
    qIndex: { product_sense:0, execution:0, analytics:0, behavioral:0, fintech_domain:0 },
    log: [],
    stampDates: []
  };
}

async function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch(e) { console.error("save failed", e); }
}

function scheduledDaysBetween(fromDate, toDate) {
  // returns list of scheduled weekday numbers strictly between fromDate(exclusive) and toDate(inclusive)
  let count = 0;
  let d = new Date(fromDate);
  d.setDate(d.getDate() + 1);
  while (d <= toDate) {
    if (SCHEDULE[d.getDay()] && todayStr(d) !== todayStr(toDate)) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

function checkStreakBreak() {
  if (!state.lastPracticedDate) return;
  const last = new Date(state.lastPracticedDate);
  const today = new Date();
  today.setHours(0,0,0,0);
  last.setHours(0,0,0,0);
  const missed = scheduledDaysBetween(last, today);
  if (missed > 0) {
    state.streak = 0;
  }
}

function getTopicForToday() {
  const dow = new Date().getDay();
  return SCHEDULE[dow] || null;
}

function render() {
  document.getElementById('streakNum').textContent = state.streak;
  document.getElementById('bestNum').textContent = state.best;

  // stamp row - last 8 scheduled sessions
  const stampRow = document.getElementById('stampRow');
  stampRow.innerHTML = '';
  const recent = state.stampDates.slice(-8);
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'stamp' + (recent[i] ? ' done' : '');
    s.textContent = recent[i] ? '✓' : '';
    stampRow.appendChild(s);
  }

  const todayKey = getTopicForToday();
  const scheduledToday = !!todayKey;
  const doneToday = state.lastPracticedDate === todayStr();

  const todayCount = state.log.filter(e => e.date === todayStr()).length;

  let nextTxt = '';
  if (doneToday) {
    nextTxt = todayCount + (todayCount === 1 ? " question" : " questions") + " logged today. Next scheduled: " + nextScheduledLabel();
  } else if (scheduledToday) {
    nextTxt = "Scheduled today — " + TOPICS[todayKey].label;
  } else {
    nextTxt = "Free day. Next scheduled: " + nextScheduledLabel();
  }
  document.getElementById('nextLine').innerHTML = nextTxt;

  activeTopicKey = todayKey || activeTopicKey || 'product_sense';
  renderTopicCard(doneToday);
  renderLog();

  document.getElementById('moreCard').style.display = doneToday ? 'block' : 'none';
  renderMoreSelect();
}

function renderMoreSelect() {
  const sel = document.getElementById('moreTopicSelect');
  if (sel.options.length === 0) {
    Object.keys(TOPICS).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = TOPICS[key].label;
      sel.appendChild(opt);
    });
  }
  sel.value = activeTopicKey;
}

function nextScheduledLabel() {
  let d = new Date();
  for (let i = 1; i <= 7; i++) {
    d.setDate(d.getDate() + 1);
    if (SCHEDULE[d.getDay()]) {
      return dayName(d) + " · " + TOPICS[SCHEDULE[d.getDay()]].label;
    }
  }
  return '';
}

function renderTopicCard(doneToday) {
  const key = activeTopicKey;
  const topic = TOPICS[key];
  document.getElementById('topicTag').textContent = getTopicForToday() === key ? "TODAY'S TOPIC" : "PRACTICING";
  document.getElementById('topicHeading').textContent = topic.label;

  const qArea = document.getElementById('questionArea');
  qArea.innerHTML = '';

  if (doneToday && getTopicForToday() === key) {
    const banner = document.createElement('div');
    banner.className = 'done-banner';
    banner.textContent = "✓ Practiced today — streak: " + state.streak + " days";
    qArea.appendChild(banner);
  }

  const idx = state.qIndex[key] % topic.questions.length;
  const qBlock = document.createElement('div');
  qBlock.className = 'q-block';
  qBlock.innerHTML = '<span class="qn">Q' + (idx+1) + ' of ' + topic.questions.length + '</span>' + topic.questions[idx];
  qArea.appendChild(qBlock);

  const markBtn = document.getElementById('markBtn');
  markBtn.disabled = doneToday;
  markBtn.textContent = doneToday ? "Streak already logged today" : "Mark session practiced";
}

function renderLog() {
  const logList = document.getElementById('logList');
  logList.innerHTML = '';
  if (state.log.length === 0) {
    logList.innerHTML = '<div class="log-empty">No entries yet — your first stamp goes here.</div>';
    return;
  }
  const recent = [...state.log].reverse().slice(0, 12);
  recent.forEach(entry => {
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = '<span class="d">' + entry.date + '</span><span class="t">' + entry.topic + (entry.note ? ' — ' + escapeHtml(entry.note) : '') + '</span>';
    logList.appendChild(row);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('markBtn').addEventListener('click', async () => {
  const key = activeTopicKey;
  const topic = TOPICS[key];
  const today = todayStr();
  if (state.lastPracticedDate === today) return;

  const note = document.getElementById('noteField').value.trim();

  state.streak += 1;
  state.best = Math.max(state.best, state.streak);
  state.lastPracticedDate = today;
  state.qIndex[key] = (state.qIndex[key] + 1) % topic.questions.length;
  state.log.push({ date: today, topic: topic.label, note: note });
  state.stampDates.push(today);

  document.getElementById('noteField').value = '';
  await saveState();
  render();
});

document.getElementById('moreBtn').addEventListener('click', async () => {
  const key = document.getElementById('moreTopicSelect').value;
  const topic = TOPICS[key];
  const idx = state.qIndex[key] % topic.questions.length;
  state.qIndex[key] = (state.qIndex[key] + 1) % topic.questions.length;
  state.log.push({ date: todayStr(), topic: topic.label, note: '' });
  await saveState();

  activeTopicKey = key;
  document.getElementById('topicTag').textContent = "EXTRA — " + topic.label.toUpperCase();
  document.getElementById('topicHeading').textContent = topic.label;
  const qArea = document.getElementById('questionArea');
  qArea.innerHTML = '<div class="q-block"><span class="qn">Q' + (idx+1) + ' of ' + topic.questions.length + '</span>' + topic.questions[idx] + '</div>';
  qArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
  render();
});

document.getElementById('skipTopicBtn').addEventListener('click', () => {
  const keys = Object.keys(TOPICS);
  const idx = keys.indexOf(activeTopicKey);
  activeTopicKey = keys[(idx + 1) % keys.length];
  renderTopicCard(state.lastPracticedDate === todayStr() && getTopicForToday() === activeTopicKey);
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('Reset all streak and log data?')) return;
  state = {
    streak: 0, best: 0, lastPracticedDate: null,
    qIndex: { product_sense:0, execution:0, analytics:0, behavioral:0, fintech_domain:0 },
    log: [], stampDates: []
  };
  await saveState();
  render();
});

(async function init() {
  state = await loadState();
  checkStreakBreak();
  await saveState();
  render();
})();
</script>
</body>
</html>
